# General Options
# -----------------------------------------------------------------------------
set -g prefix C-a               # Set the prefix to C-a
unbind C-b                      # Unbind the default prefix
bind C-a send-prefix            # Rebind C-a to send the prefix
set -s escape-time 0            # Faster escape key response
set -g renumber-windows on      # Renumber windows after one is closed
set -g base-index 1             # Start windows at 1
set -g pane-base-index 1        # Start panes at 1
set -g status-position bottom   # Status bar at the bottom
set -g history-limit 10000      # Scrollback buffer size
setw -g mouse on                # Enable mouse support
set -g default-terminal "tmux-256color"
# Truecolor: tmux detects it from COLORTERM, which Alacritty sets; this covers
# Alacritty when COLORTERM does not reach tmux (for example over ssh).
set -as terminal-features ",alacritty*:RGB"

# Formerly from tmux-sensible; the rest of it is set elsewhere in this file or
# is default in tmux 3.6.
set -g display-time 4000        # Messages stay up for 4 s
set -g status-interval 5        # Refresh the status bar every 5 s
set -g status-keys vi           # Vi keys in the command prompt (prefix :)
set -g focus-events on          # Pass focus events through (nvim autoread)
setw -g aggressive-resize on    # Size each window to the clients viewing it

# Key Bindings
# -----------------------------------------------------------------------------
# Split panes and open new windows in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Navigate panes using Vim-like keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Swap panes
bind-key C-h swap-pane -U # Swap with the previous pane (by index)
bind-key C-j swap-pane -D # Swap with the next pane (by index)

# Resize panes with Vim-like keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Change windows
bind -n M-H previous-window
bind -n M-L next-window
bind -r C-p previous-window
bind -r C-n next-window
bind a last-window              # session tree is on the default prefix s

# Copy Mode (prefix [ or prefix y to enter; v select, y copy)
# Copies go to tmux's buffer and, through OSC 52, to the system clipboard.
# The terminal does the clipboard work, so this needs no pbcopy/xclip/wl-copy
# and also works for programs running over ssh.
setw -g mode-keys vi
set -s set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind y copy-mode
bind p paste-buffer

# Session management
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind z resize-pane -Z

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded."

# Plugins
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Kiro's shell integration runs each pane's shell under `kiro-cli-term` on a
# second pty, so the plugin's default `ps -t #{pane_tty}` check never sees nvim
# and C-h/j/k/l always switch tmux panes. nvim sets the pane option
# @pane_is_vim on enter and clears it on exit (lua/config/autocmds.lua); the
# tty check still covers unwrapped panes and fzf.
set -g @vim_navigator_check "[ -n '#{@pane_is_vim}' ] || ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"

# Gruvbox theme
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# Synthweave theme
#set -g @plugin 'samharju/tmux-synthweave-theme'

# Session persistence: resurrect saves/restores (prefix C-s / C-r); continuum
# saves every minute and restores the last save when the server starts.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
# nvim sessions are saved by auto-session (on exit, including tmux shutdown)
# and restored only when nvim starts without file arguments, so every nvim
# pane is restored as plain `nvim`. No @resurrect-strategy-nvim: a strategy
# overrides this and would put the original arguments back.
set -g @resurrect-processes '"~nvim->nvim" vim vi python python3 less bat tail btm top htop btop fzf kiro-cli'
# Restore Kiro chats (`kiro-cli chat --resume-id <id>`) and nvim panes, which
# resurrect cannot see under Kiro's shell wrapper; see the script header.
set -g @resurrect-hook-post-save-layout '~/.config/tmux/scripts/resurrect-hook save'

# Must come after every plugin that sets status-right (the theme), since it
# hooks its autosave into status-right.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# Initialize TPM
# This block checks for and installs TPM if it's not present.
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
